/* ---------- editor (owner) ---------- */
let E = null;
const CONDITIONS = ['New', 'Like new', 'Good', 'Fair', 'Well-loved'];
const DEFAULT_CATS = ['Furniture', 'Kitchen', 'Electronics', 'Lighting', 'Decor', 'Books', 'Plants', 'Outdoor', 'Clothing', 'Sports', 'Kids', 'Other'];

function parseDims(s) {
  s = String(s || '');
  const g = k => (s.match(new RegExp('\\b' + k + '\\s*([\\d.,]+)', 'i')) || [])[1] || '';
  const unit = (s.match(/\b(mm|cm|m|in)\b/i) || [])[1] || 'cm';
  const out = { w: g('W'), d: g('D'), h: g('H'), unit: unit.toLowerCase() };
  out.parsed = !s.trim() || !!(out.w || out.d || out.h);
  return out;
}
function buildDims(w, d, h, unit) {
  const parts = [w && 'W ' + w, d && 'D ' + d, h && 'H ' + h].filter(Boolean);
  return parts.length ? parts.join(' × ') + ' ' + unit : '';
}

function openEditor(id) {
  const it = id ? byId(id) : null;
  E = { id: it ? it.id : null, photos: (it ? it.photos : []).map(ref => ({ ref })), dims: it ? it.dimensions : '', dirty: false, busy: false };
  const v = k => esc(it ? it[k] : '');
  const dm = parseDims(E.dims);
  const cats = [...new Set([...S.items.map(i => i.category).filter(Boolean), ...DEFAULT_CATS])];
  const rooms = [...new Set(S.items.map(i => i.room).filter(Boolean))];
  const cond = it ? it.condition : '';
  $('#editorForm').innerHTML = `
    <div class="dhead"><h2>${it ? 'Edit item' : 'Add an item'}</h2><button type="button" class="x" data-act="editor-cancel" aria-label="Close">${icon('x')}</button></div>
    <div class="eform">
      <div class="c6 field"><span>Photos — the first one is the cover</span><div class="photos" id="photoGrid"></div>
        <span class="hint">On your phone you can take photos straight from here. Photos are resized before uploading.</span></div>
      <label class="c6 field"><span>Title *</span><input class="input" name="title" required maxlength="120" value="${v('title')}" placeholder="e.g. Oak dining table"></label>
      <label class="c6 field"><span>Description</span><textarea class="input" name="description" maxlength="4000" rows="4" placeholder="Anything people should know: wear and tear, what’s included, why you’re letting it go…">${v('description')}</textarea></label>
      <label class="c3 field"><span>Category</span><input class="input" name="category" list="catList" maxlength="40" value="${v('category')}" placeholder="Furniture">
        <datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <label class="c3 field"><span>Condition</span><select class="input" name="condition">
        <option value="">—</option>${[...new Set([...CONDITIONS, cond].filter(Boolean))].map(c => `<option${c === cond ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <div class="c6 field"><span>Dimensions</span>
        <div class="dimrow">
          <label><b>W</b><input class="input mono" name="dw" inputmode="decimal" value="${esc(dm.w)}" aria-label="Width"></label>
          <label><b>D</b><input class="input mono" name="dd" inputmode="decimal" value="${esc(dm.d)}" aria-label="Depth"></label>
          <label><b>H</b><input class="input mono" name="dh" inputmode="decimal" value="${esc(dm.h)}" aria-label="Height"></label>
          <select class="input" name="du" aria-label="Unit">${['cm', 'mm', 'm', 'in'].map(u => `<option${u === dm.unit ? ' selected' : ''}>${u}</option>`).join('')}</select>
        </div>
        ${dm.parsed ? '' : `<span class="hint">Currently: <span class="mono">${esc(E.dims)}</span> — kept unless you fill in numbers.</span>`}
      </div>
      <label class="c2 field"><span>Price</span><input class="input" name="price" maxlength="30" value="${v('price')}" placeholder="Free"></label>
      <label class="c2 field"><span>Where is it</span><input class="input" name="room" list="roomList" maxlength="60" value="${v('room')}" placeholder="Living room">
        <datalist id="roomList">${rooms.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <label class="c2 field"><span>Pickup</span><input class="input" name="pickup" maxlength="300" value="${v('pickup')}" placeholder="From 1 Dec"></label>
    </div>
    <div class="efoot">
      <button type="button" class="btn" data-act="editor-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">${it ? 'Save changes' : 'Add item'}</button>
    </div>`;
  renderPhotoGrid();
  const d = $('#editorDlg');
  if (!d.open) d.showModal();
  if (!it) setTimeout(() => $('[name=title]', d)?.focus(), 50);
}

function renderPhotoGrid() {
  const g = $('#photoGrid'); if (!g) return;
  g.innerHTML = E.photos.map((p, i) => `
    <div class="pthumb">
      <img src="${esc(p.preview || photoURL(p.ref, 300))}" alt="" data-ref="${esc(p.preview ? '' : p.ref)}" data-w="300">
      ${i === 0 ? '<span class="cover">Cover</span>' : ''}
      <span class="pbtns">
        ${i > 0 ? `<button type="button" data-act="ph-left" data-i="${i}" aria-label="Move earlier">${icon('left')}</button>` : ''}
        <button type="button" data-act="ph-del" data-i="${i}" aria-label="Remove photo">${icon('x')}</button>
      </span>
    </div>`).join('') +
    (E.photos.length < 10 ? `<label class="padd">${icon('camera')}<span>Add photos</span><input type="file" accept="image/*" multiple hidden id="photoInput"></label>` : '');
  $('#photoInput')?.addEventListener('change', onPhotos);
}

async function resizeImage(file, max = 1600, quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(`Couldn’t read “${file.name}”. Try a JPEG or PNG.`)); i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', quality);
  } finally { URL.revokeObjectURL(url); }
}

async function onPhotos(e) {
  const files = [...e.target.files].slice(0, 10 - E.photos.length);
  const lbl = e.target.closest('.padd');
  if (lbl) lbl.querySelector('span').textContent = 'Processing…';
  for (const f of files) {
    try { const data = await resizeImage(f, DEMO ? 900 : 1600, DEMO ? 0.72 : 0.82); E.photos.push({ data, preview: data }); E.dirty = true; }
    catch (err) { toast(err.message, 'err'); }
  }
  renderPhotoGrid();
}

$('#editorForm').addEventListener('input', () => { if (E) E.dirty = true; });
$('#editorForm').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !E) return;
  const i = +b.dataset.i;
  if (b.dataset.act === 'ph-del') { E.photos.splice(i, 1); E.dirty = true; renderPhotoGrid(); }
  if (b.dataset.act === 'ph-left') { const [p] = E.photos.splice(i, 1); E.photos.splice(i - 1, 0, p); E.dirty = true; renderPhotoGrid(); }
  if (b.dataset.act === 'editor-cancel') closeEditor();
});
function closeEditor() {
  if (E && E.busy) return;
  if (E && E.dirty && !confirm('Discard your changes?')) return;
  $('#editorDlg').close();
}
$('#editorDlg').addEventListener('cancel', e => { e.preventDefault(); closeEditor(); });

$('#editorForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!E || E.busy) return;
  const f = e.target, val = n => (f.elements[n]?.value || '').trim();
  const title = val('title');
  if (!title) { f.elements.title.focus(); toast('Give the item a title.', 'err'); return; }
  const built = buildDims(val('dw'), val('dd'), val('dh'), val('du'));
  const dims = built || (parseDims(E.dims).parsed ? '' : E.dims);
  const btn = $('#saveBtn');
  E.busy = true; btn.disabled = true;
  try {
    const pending = E.photos.filter(p => !p.ref).length;
    let n = 0;
    for (const p of E.photos) {
      if (p.ref) continue;
      n++; btn.textContent = `Uploading photo ${n} of ${pending}…`;
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40);
      const r = await api('uploadPhoto', { data: p.data.split(',')[1], mime: 'image/jpeg', name: `${slug}-${n}.jpg` });
      p.ref = r.id;
    }
    btn.textContent = 'Saving…';
    const r = await api('saveItem', { item: {
      id: E.id, title, description: f.elements.description.value.trim(), category: val('category'), condition: val('condition'),
      dimensions: dims, price: val('price'), room: val('room'), pickup: val('pickup'), photos: E.photos.map(p => p.ref),
    } });
    const it = upsert(r.item);
    const wasNew = !E.id;
    E.busy = false; E.dirty = false;
    $('#editorDlg').close();
    if (wasNew && S.filter !== 'all' && S.filter !== 'available') { S.filter = 'available'; }
    renderAll();
    toast(wasNew ? 'Item added.' : 'Saved.', 'ok');
    if (!wasNew && $('#detailDlg').open && S.openId === it.id) renderDetail();
  } catch (err) {
    toast(err.message, 'err');
    E.busy = false; btn.disabled = false; btn.textContent = E.id ? 'Save changes' : 'Add item';
  }
});

/* ---------- pickups (owner) ---------- */
function groupByPerson(items) {
  const groups = {};
  items.forEach(it => {
    const k = it.claimedBy.trim().toLowerCase();
    (groups[k] = groups[k] || { name: it.claimedBy.trim(), items: [] }).items.push(it);
  });
  return Object.values(groups).sort((a, b) => a.name.localeCompare(b.name));
}
// claimed items grouped by pickup time (chronological), then by person
function pickupSections() {
  const secs = new Map();
  S.items.filter(i => i.status === 'claimed').forEach(it => {
    const k = slotById(it.pickupSlot) ? it.pickupSlot : it.pickupSlot === 'other' ? 'other' : '';
    if (!secs.has(k)) secs.set(k, []);
    secs.get(k).push(it);
  });
  const order = [...S.slots.map(s => s.id).filter(k => secs.has(k)), ...['other', ''].filter(k => secs.has(k))];
  return order.map(k => ({
    label: k === '' ? (S.slots.length ? 'No time chosen yet' : '') : k === 'other' ? 'Arranging another time' : slotLabel(slotById(k)),
    groups: groupByPerson(secs.get(k)),
  }));
}
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function openPickups() {
  const t = todayISO();
  $('#pickupsBody').innerHTML = `
    <div class="dhead"><h2>Pickups</h2><div class="btnrow"><span id="pkCopy"></span>
      <button class="x" data-close="pickupsDlg" aria-label="Close">${icon('x')}</button></div></div>
    <section class="slotmgr">
      <div><h3>Times you’re around</h3><p class="hint">People pick one of these when they claim something.</p></div>
      <div class="slotchips" id="slotChips"></div>
      <form class="slotadd" id="slotForm" novalidate>
        <label class="field"><span>Day</span><input class="input" type="date" name="day" min="${t}" value="${t}" required></label>
        <label class="field"><span>From</span><input class="input" type="time" name="from" value="10:00" step="900" required></label>
        <label class="field"><span>To</span><input class="input" type="time" name="to" value="12:00" step="900" required></label>
        <button class="btn primary" type="submit">${icon('plus')}Add time</button>
      </form>
    </section>
    <div class="plist" id="plist"></div>`;
  renderPickups();
  $('#pickupsDlg').showModal();
}
const groupHTML = g => `
  <section class="pgroup"><h3>${esc(g.name)} <span>${g.items.length} item${g.items.length > 1 ? 's' : ''}</span></h3>
    ${g.items.sort((a, b) => a.claimedAt - b.claimedAt).map(it => `
      <div class="prow">
        <div class="pimg">${imgTag(it.photos[0], 160)}</div>
        <div><button class="pt" data-open="${esc(it.id)}">${esc(it.title)}</button>
          <div class="pm">${esc(priceLabel(it.price))} · claimed ${esc(timeAgo(it.claimedAt))}${it.waitlist.length ? ` · ${it.waitlist.length} waiting` : ''}</div>
          ${it.claimMessage ? `<div class="pmsg">${esc(it.claimMessage)}</div>` : ''}</div>
        <button class="btn" data-act="gone" data-id="${esc(it.id)}" title="Mark as handed over">${icon('check')}<span>Handed over</span></button>
      </div>`).join('')}
  </section>`;
function renderPickups() {
  if (!$('#plist')) return;
  const secs = pickupSections(), now = Date.now();
  $('#pkCopy').innerHTML = secs.length ? `<button class="btn" data-act="copy-pickups">Copy list</button>` : '';
  $('#slotChips').innerHTML = S.slots.length ? S.slots.map(s => {
    const b = slotBooked(s.id);
    return `<span class="slotchip${s.end < now ? ' past' : ''}"><span>${esc(slotLabel(s))}</span>${b ? `<span class="n">${b} booked</span>` : ''}
      <button type="button" data-act="slot-del" data-sid="${esc(s.id)}" aria-label="Remove this time">${icon('x')}</button></span>`;
  }).join('') : '<span class="hint">No times yet. Add the days and hours you’ll be home.</span>';
  $('#plist').innerHTML = secs.length
    ? secs.map(sec => (sec.label ? `<div class="pslot-h">${esc(sec.label)}</div>` : '') + sec.groups.map(groupHTML).join('')).join('')
    : `<div class="empty">${icon('users')}<p>No open claims right now.</p></div>`;
}
function pickupsText() {
  return pickupSections().map(sec => (sec.label ? sec.label.toUpperCase() + '\n' : '') + sec.groups.map(g => `${g.name}:\n` +
    g.items.map(it => `  • ${it.title} (${priceLabel(it.price)})${it.claimMessage ? ' — “' + it.claimMessage.replace(/\s+/g, ' ') + '”' : ''}`).join('\n')).join('\n\n')).join('\n\n\n');
}

/* ---------- gate, session, refresh ---------- */
// accepts a bare code or a pasted invite link, ignoring stray quotes/punctuation
function cleanCode(v) {
  let s = String(v || '').trim();
  const m = s.match(/[#&?]k=([^&\s]+)/);
  if (m) { try { s = decodeURIComponent(m[1]); } catch { s = m[1]; } }
  return s.replace(/^[\s"'`<(\[]+|[\s"'`>)\].,;:!]+$/g, '');
}
function showGate(mode = 'friend', err = '') {
  S.gateMode = mode;
  $('#app').hidden = true; $('#gate').hidden = false;
  $('#gateText').textContent = mode === 'owner' ? 'Enter your owner code to add and edit items.' : 'This page is just for friends and family. Enter the access code from your invite.';
  $('#gateErr').textContent = err;
  $('#gateBack').hidden = !(mode === 'owner' && S.role);
  $('#gateCode').value = '';
  setTimeout(() => $('#gateCode').focus(), 30);
}
function showApp() { $('#gate').hidden = true; $('#app').hidden = false; }

$('#gateBack').addEventListener('click', () => showApp());
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const code = cleanCode($('#gateCode').value); if (!code) return;
  const btn = $('#gateBtn'); btn.disabled = true; btn.textContent = 'Checking…';
  const prevKey = S.key;
  S.key = code;
  try {
    const r = await listReq();
    LS.set('key', code);
    applyList(r);
    showApp(); renderAll();
    if (S.role === 'owner') toast('Signed in as owner.', 'ok');
  } catch (err) {
    S.key = prevKey;
    $('#gateErr').textContent = err.code === 'AUTH' ? 'That code didn’t work — check your invite.' : err.message;
  } finally { btn.disabled = false; btn.textContent = 'Enter'; }
});

function signOut(msg) {
  LS.del('key'); LS.del('cache'); S.key = null; S.role = null; S.items = []; S.slots = [];
  showGate('friend', msg || '');
}

function applyList(r) {
  S.role = r.role;
  S.friendCode = r.friendCode || '';
  S.items = (r.items || []).map(normalise);
  S.slots = normSlots(r.slots);
  S.lastSync = Date.now(); S.offline = false;
  if (r.you && typeof r.you === 'object') reconcile(r.you, r._sent || new Set()); else pruneMine();
  // remembered so the next visit can show the list instantly while it refreshes
  if (!DEMO) LS.set('cache', { key: S.key, role: S.role, items: r.items || [], slots: r.slots || [] });
}
// trust the server about which claims / waitlist places this browser holds (only for tokens sent with that request)
function reconcile(you, sent) {
  const won = [];
  for (const [id, tok] of Object.entries(queued)) {
    if (!sent.has(tok)) continue;
    if (you[id] === 'claim') { mine[id] = tok; delete queued[id]; won.push(id); }
    else if (typeof you[id] !== 'number') delete queued[id];
  }
  for (const [id, tok] of Object.entries(mine)) if (sent.has(tok) && you[id] !== 'claim') delete mine[id];
  S.qpos = {};
  for (const [id, v] of Object.entries(you)) if (typeof v === 'number') S.qpos[id] = v;
  LS.set('mine', mine); LS.set('queued', queued);
  won.forEach(id => { const it = byId(id); if (it) setTimeout(() => toast(`Good news: “${it.title}” passed to you. It’s yours!`, 'ok'), 300); });
}

let refreshing = false;
async function refresh(silent = true) {
  if (refreshing || !S.key) return;
  refreshing = true;
  try {
    applyList(await listReq());
    renderAll();
    if (!silent) toast('Up to date.');
  } catch (e) {
    if (e.code === 'AUTH') { signOut('Your access code no longer works. Ask for a new invite.'); return; }
    S.offline = true; renderFoot();
    if (!silent) toast(e.message, 'err');
  } finally { refreshing = false; }
}

setInterval(() => { if (!document.hidden && S.key && !$('#editorDlg').open) refresh(true); }, Math.max(10, +CONFIG.REFRESH_SECONDS || 30) * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.key && Date.now() - S.lastSync > 8000) refresh(true); });

// an invite/owner link opened in a tab that already shows the page
window.addEventListener('hashchange', async () => {
  const k = cleanCode(new URLSearchParams(location.hash.slice(1)).get('k') || '');
  if (!k) return;
  history.replaceState(null, '', location.pathname + location.search);
  const prevKey = S.key;
  S.key = k.trim();
  try {
    applyList(await listReq());
    LS.set('key', S.key);
    showApp(); renderAll();
    toast(S.role === 'owner' ? 'Signed in as owner.' : 'You’re in.', 'ok');
  } catch (e) {
    S.key = prevKey;
    if (e.code === 'AUTH') { if (prevKey) toast('That link’s code didn’t work.', 'err'); else showGate('friend', 'That invite code didn’t work — check the link you were sent.'); }
    else toast(e.message, 'err');
  }
});

async function boot() {
  paintStatic();
  S.filter = LS.get('filter', 'available'); S.sort = LS.get('sort', 'new'); $('#sort').value = S.sort;
  const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
  if (hashKey && cleanCode(hashKey)) { LS.set('key', cleanCode(hashKey)); history.replaceState(null, '', location.pathname + location.search); }
  S.key = LS.get('key', null);
  if (DEMO) {
    $('#gateHint').hidden = false;
    $('#gateHint').innerHTML = 'Demo codes: <span class="mono">friends</span> or <span class="mono">owner</span>';
    if (!S.key) { S.key = Mock.FRIEND; LS.set('key', S.key); }
  }
  if (!S.key) return showGate('friend');
  showApp();
  const cached = !DEMO && LS.get('cache', null);
  if (cached && cached.key === S.key) { S.role = cached.role; S.items = (cached.items || []).map(normalise); S.slots = normSlots(cached.slots); renderAll(); }
  else renderSkeleton();
  try {
    applyList(await listReq());
    renderAll();
  } catch (e) {
    if (e.code === 'AUTH') { LS.del('key'); S.key = null; return showGate('friend', 'That invite code didn’t work — check the link you were sent.'); }
    S.offline = true;
    if (S.items.length) { renderFoot(); toast(e.message, 'err'); return; }
    $('#grid').innerHTML = '';
    $('#empty').hidden = false;
    $('#empty').innerHTML = icon('refresh') + `<p>${esc(e.message)}</p><p><button class="btn" data-act="refresh">Try again</button></p>`;
    renderFoot();
  }
}

boot();
})();
</script>
